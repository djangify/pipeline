<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pipeline{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <nav class="bg-slate-50 text-slate-800 border-b border-slate-200">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-6">
                    <a href="{% url 'crm:contact_list' %}" class="text-xl font-bold tracking-wide text-slate-800">PIPELINE</a>
                    {% if user.is_authenticated %}
                    <div class="hidden md:flex space-x-4">
                        <a href="{% url 'crm:contact_list' %}" class="text-slate-600 hover:text-slate-900">Contacts</a>
                        <a href="{% url 'crm:followups' %}" class="text-slate-600 hover:text-slate-900">Follow-ups</a>
                        <a href="{% url 'admin:index' %}" class="text-slate-600 hover:text-slate-900">Admin</a>
                    </div>
                    {% endif %}
                </div>
                <div class="flex items-center space-x-4">
                    {% if user.is_authenticated %}
                    <a href="{% url 'crm:contact_create' %}" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1.5 px-3 rounded text-sm">Add Contact</a>
                    <form method="post" action="{% url 'logout' %}" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="text-sm text-slate-500 hover:text-slate-800">Log out</button>
                    </form>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-800 text-white py-4 text-center text-sm">
        Pipeline — a small leads CRM
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
